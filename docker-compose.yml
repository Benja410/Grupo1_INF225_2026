services:
  db:
    image: postgres:16-alpine
    container_name: inf236-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    container_name: inf236-backend
    working_dir: /app
    command: sh -c "npm install && node --env-file .env.docker src/db/migrate.js && node --env-file .env.docker --watch src/index.js"
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      PORT: 8000
      URL: http://localhost
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: inf236-frontend
    working_dir: /app
    command: sh -c "npm --prefix front install && npm run start:front"
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      PORT: 3000
    volumes:
      - ./:/app
      - frontend_node_modules:/app/front/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
